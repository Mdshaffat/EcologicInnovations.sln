<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Californium Core logo</title>
  <desc id="desc">A blue and cyan double C logo with atomic orbits and a glowing nucleus.</desc>
  <defs>
    <linearGradient id="outer-c" x1="95" y1="82" x2="268" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.44" stop-color="#0757b8"/>
      <stop offset="1" stop-color="#052b72"/>
    </linearGradient>
    <linearGradient id="inner-c" x1="187" y1="151" x2="384" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23e2f2"/>
      <stop offset="0.45" stop-color="#04a8d3"/>
      <stop offset="1" stop-color="#0757b8"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="32%" r="70%">
      <stop offset="0" stop-color="#c8fbff"/>
      <stop offset="0.18" stop-color="#18d6f4"/>
      <stop offset="0.58" stop-color="#0767bd"/>
      <stop offset="1" stop-color="#041c55"/>
    </radialGradient>
    <linearGradient id="orbit" x1="34" y1="304" x2="479" y2="199" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa7ba"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#8fa4bf"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#00183d" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <ellipse cx="256" cy="258" rx="235" ry="55" fill="none" stroke="#13223d" stroke-width="17" opacity="0.42" transform="rotate(-22 256 258)"/>
    <ellipse cx="256" cy="258" rx="235" ry="55" fill="none" stroke="url(#orbit)" stroke-width="9" transform="rotate(-22 256 258)"/>
    <ellipse cx="256" cy="258" rx="235" ry="55" fill="none" stroke="#38d9ff" stroke-width="2" opacity="0.75" transform="rotate(-22 256 258)"/>

    <path d="M271 77C160 61 59 145 48 258c-11 114 73 212 184 220 24 2 49-1 72-8v-73c-22 9-46 13-71 10-71-8-124-70-117-142 7-73 71-127 144-120 17 2 33 7 48 15V86c-12-4-24-7-37-9Z"
          fill="url(#outer-c)"/>
    <path d="M286 95v62c-18-8-39-13-61-11-62 6-108 59-102 121 6 58 55 101 113 101 18 0 35-4 50-12v64c-17 7-35 11-54 11-96 0-174-77-174-174S136 82 232 82c19 0 37 5 54 13Z"
          fill="#073c91" opacity="0.42"/>

    <path d="M385 174c-34-36-85-55-139-47-72 11-124 75-113 147 11 73 79 123 151 112 39-6 73-27 95-57h-99c-10 7-22 12-35 14-45 7-87-24-94-69-7-44 24-86 69-93 22-3 43 3 60 16h105v-23Z"
          fill="url(#inner-c)"/>
    <path d="M380 329c-23 31-58 51-96 57-72 11-140-39-151-112-2-13-2-26 0-38 21 72 94 112 164 88 14-5 28-13 39-24h62c-5 10-11 20-18 29Z"
          fill="#014f9c" opacity="0.32"/>

    <rect x="251" y="105" width="13" height="296" rx="6.5" fill="#e8f4ff"/>
    <rect x="257" y="105" width="5" height="296" rx="2.5" fill="#8aa6c7"/>

    <circle cx="257" cy="256" r="49" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="239" cy="236" r="13" fill="#ffffff" opacity="0.68"/>

    <circle cx="82" cy="356" r="19" fill="#08b9e5" stroke="#03326f" stroke-width="5"/>
    <circle cx="431" cy="138" r="18" fill="#08b9e5" stroke="#03326f" stroke-width="5"/>
  </g>
</svg>
